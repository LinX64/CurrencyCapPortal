name: Gheymat static fallback

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
    inputs:
      history:
        description: 'Backfill 40 archive days instead of 12 in this run'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/gheymat-latest.yml'

concurrency:
  group: gheymat-static
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Carry over the current site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: dist
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install -q -r requirements.txt

      - name: Mask the channel keys
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
          GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
        run: |
          if [ -z "$GHEYMAT_PAYLOAD_KEY" ] || [ -z "$GHEYMAT_SIGNING_KEY" ]; then
            echo "GHEYMAT_PAYLOAD_KEY / GHEYMAT_SIGNING_KEY secrets are not set" >&2
            exit 1
          fi
          echo "::add-mask::$GHEYMAT_PAYLOAD_KEY"
          echo "::add-mask::$GHEYMAT_SIGNING_KEY"

      - name: "Plan this run (12 archive days of backfill per run; manual runs can ask for 40)"
        id: plan
        env:
          HISTORY: ${{ github.event.inputs.history }}
        run: |
          if [ "$HISTORY" = "true" ]; then
            echo "flag=--history --backfill 40 --pace 3" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--history --backfill 12 --pace 3" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch bonbast and write the static API
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
          GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
          GHEYMAT_PLAIN: "1"
          FLAGS: ${{ steps.plan.outputs.flag }}
        run: |
          rm -rf dist/.git
          mkdir -p dist
          touch dist/.nojekyll
          python tools/gheymat_snapshot.py --out dist $FLAGS
          echo "plain files: $(find dist/v1 -type f | wc -l), sealed files: $(find dist/d -type f 2>/dev/null | wc -l)"

      - name: Verify the sealed v1/latest envelope before deploying
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
        run: python tools/verify_sealed.py dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Gheymat static fallback'
