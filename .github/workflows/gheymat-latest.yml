name: Gheymat static fallback

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      history:
        description: 'Backfill 40 archive days instead of 12 in this run'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/gheymat-latest.yml'

concurrency:
  group: gheymat-static
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Carry over the current site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          ref: gh-pages
          path: dist
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: pip install -q -r requirements.txt

      - name: Mask the channel keys
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
          GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
        run: |
          if [ -z "$GHEYMAT_PAYLOAD_KEY" ] || [ -z "$GHEYMAT_SIGNING_KEY" ]; then
            echo "GHEYMAT_PAYLOAD_KEY / GHEYMAT_SIGNING_KEY secrets are not set" >&2
            exit 1
          fi
          echo "::add-mask::$GHEYMAT_PAYLOAD_KEY"
          echo "::add-mask::$GHEYMAT_SIGNING_KEY"

      - name: Publish loop (fetch, backfill 12 archive days, verify, push to gh-pages; every 6.5 minutes for ~5.5 hours)
        env:
          GHEYMAT_PAYLOAD_KEY: ${{ secrets.GHEYMAT_PAYLOAD_KEY }}
          GHEYMAT_SIGNING_KEY: ${{ secrets.GHEYMAT_SIGNING_KEY }}
          GHEYMAT_PLAIN: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA: ${{ github.event.inputs.history == 'true' && '--backfill 40' || '--backfill 12' }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 330*60 ))
          iteration=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            iteration=$((iteration + 1))
            started=$(date +%s)
            rm -rf dist && mkdir -p dist
            if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
              git --work-tree=dist checkout -q FETCH_HEAD -- . || true
              git reset -q
            fi
            find dist -mindepth 1 -maxdepth 1 ! -name v1 ! -name d -exec rm -rf {} +
            touch dist/.nojekyll
            python tools/gheymat_snapshot.py --out dist --history $EXTRA --pace 3
            python tools/verify_sealed.py dist
            (
              cd dist
              git init -q
              git checkout -q -b gh-pages
              git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com add -A
              git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "Gheymat static fallback (iteration $iteration)"
              git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
            )
            rm -rf dist/.git
            echo "iteration $iteration published at $(date -u +%FT%TZ)"
            elapsed=$(( $(date +%s) - started ))
            sleep_for=$(( 390 - elapsed ))
            if [ "$(date +%s)" -ge "$deadline" ]; then break; fi
            [ "$sleep_for" -gt 0 ] && sleep "$sleep_for"
          done
