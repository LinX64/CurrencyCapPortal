name: Gheymat static fallback

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
    inputs:
      history:
        description: 'Backfill 40 archive days instead of 12 in this run'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'tools/**'
      - '.github/workflows/gheymat-latest.yml'

concurrency:
  group: gheymat-static
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Carry over the current site
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -q requests

      - name: "Plan this run (12 archive days of backfill per run; manual runs can ask for 40)"
        id: plan
        run: |
          if [ "${{ github.event.inputs.history }}" = "true" ]; then
            echo "flag=--history --backfill 40 --pace 3" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--history --backfill 12 --pace 3" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch bonbast and write the static API
        run: |
          rm -rf dist/.git
          mkdir -p dist
          touch dist/.nojekyll
          python tools/gheymat_snapshot.py --out dist ${{ steps.plan.outputs.flag }}
          ls -la dist/v1 | head

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Gheymat static fallback'
